# Pruebas ligeras: sin credenciales, sin GPU, sin descargas de datos ni de modelos.
# Usa solo el código, las configuraciones y los hashes de results/reference del repositorio.
name: pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencia mínima
        run: python -m pip install numpy==2.4.6
      - name: Pruebas
        run: python -m unittest discover -s tests -v
